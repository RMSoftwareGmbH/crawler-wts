<!doctype html>
<html lang="en">
  <head>
    <title>Example hotel reviews</title>
  </head>
  <body>
    <h1 data-stid="content-hotel-title">Example Hotels.com Hotel</h1>
    <section data-stid="reviews-list">
      <article data-stid="review-card" data-review-id="hotels-review-001">
        <div data-stid="review-rating" aria-label="9.4 out of 10">9.4</div>
        <h3 data-stid="review-title">Excellent visit</h3>
        <div data-stid="review-author">Morgan Example</div>
        <time data-stid="review-date">June 15, 2026</time>
        <p data-stid="review-text" lang="en">
          Great service and a comfortable room.
        </p>
        <div data-stid="management-response">Thank you for your feedback.</div>
      </article>
      <article data-stid="guest-review">
        <div data-stid="review-score" data-score="8"></div>
        <h3 data-stid="review-headline">Convenient location</h3>
        <p data-stid="review-content">Easy access to transit.</p>
      </article>
    </section>
  </body>
</html>
