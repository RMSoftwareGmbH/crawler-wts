<!doctype html>
<html lang="en">
  <head>
    <title>Example hotel reviews</title>
  </head>
  <body>
    <h1 data-stid="content-hotel-title">Example Expedia Hotel</h1>
    <div data-stid="reviews-list">
      <article data-stid="review-card" data-review-id="expedia-review-001">
        <div data-stid="review-rating" aria-label="9.2 out of 10">9.2</div>
        <h3 data-stid="review-title">A lovely stay</h3>
        <div data-stid="review-author">Taylor Example</div>
        <time data-stid="review-date">June 12, 2026</time>
        <p data-stid="review-text" lang="en">
          The room was comfortable and the location was ideal.
        </p>
        <div data-stid="management-response">
          Thank you for sharing your experience.
        </div>
      </article>
      <article data-stid="guest-review">
        <div data-stid="review-score" data-score="8"></div>
        <h3 data-stid="review-headline">Good value</h3>
        <p data-stid="review-content">Friendly staff and easy check-in.</p>
      </article>
    </div>
  </body>
</html>
