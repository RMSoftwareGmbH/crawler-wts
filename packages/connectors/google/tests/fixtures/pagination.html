<!doctype html>
<html lang="en">
  <head><title>Example Hotel - Google Maps</title></head>
  <body>
    <h1>Example Hotel</h1>
    <article data-review-id="example-review-001">
      <span data-rating aria-label="5 stars"></span>
      <span data-review-text>First review.</span>
      <span data-review-author>Example Guest</span>
      <time data-review-date datetime="2025-03-10">March 10, 2025</time>
    </article>
    <button data-load-more data-next-review-id="example-review-001"
      data-next-rating="5 stars" data-next-comment="First review.">More reviews</button>
  </body>
</html>
