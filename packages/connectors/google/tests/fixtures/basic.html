<!doctype html>
<html lang="en">
  <head><title>Example Hotel - Google Maps</title></head>
  <body>
    <h1>Example Hotel</h1>
    <article data-review-id="example-review-001">
      <span data-rating aria-label="5 stars"></span>
      <h3 data-review-title>Excellent stay</h3>
      <span data-review-text>  The room was clean
        and the staff were helpful. </span>
      <span data-review-author>Example Guest</span>
      <a href="/maps/contrib/example-profile">Example Guest profile</a>
      <time data-review-date datetime="2025-03-10">March 10, 2025</time>
      <div data-business-reply>Thank you for your feedback.</div>
      <a href="/maps/reviews/contrib/example-review-001">Review link</a>
    </article>
  </body>
</html>
