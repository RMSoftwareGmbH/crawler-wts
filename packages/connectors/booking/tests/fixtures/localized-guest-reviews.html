<!doctype html>
<html lang="de">
  <body>
    <h1 data-testid="title">Beispielhotel</h1>
    <button
      type="button"
      role="tab"
      aria-label="Gästebewertungen"
      data-testid="reviews-tab"
      data-action="open-reviews"
    >
      Bewertungen
    </button>
    <section
      role="dialog"
      aria-label="Gästebewertungen"
      data-testid="reviews-panel"
      data-reviews-panel
      hidden
    ></section>
    <template data-reviews-content>
      <header>Gästebewertungen</header>
      <article data-testid="review-card" data-review-id="de-review-001">
        <div data-testid="review-score">8.0</div>
        <p data-testid="review-text">Ein angenehmer Aufenthalt.</p>
      </article>
    </template>
  </body>
</html>
