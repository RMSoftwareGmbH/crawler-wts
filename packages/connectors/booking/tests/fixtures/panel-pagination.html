<!doctype html>
<html lang="en">
  <body>
    <h1 data-testid="title">Example Hotel</h1>
    <button type="button" aria-label="Guest reviews" data-action="open-reviews">
      Reviews
    </button>
    <button data-testid="load-more-reviews-button">Outside panel decoy</button>
    <section
      role="dialog"
      aria-label="Guest reviews"
      data-testid="reviews-panel"
      data-reviews-panel
      hidden
    ></section>
    <template data-reviews-content>
      <header>Guest Reviews</header>
      <article data-testid="review-card" data-review-id="page-review-001">
        <div data-testid="review-score">9.0</div>
        <p data-testid="review-text">First page review.</p>
      </article>
      <button
        data-testid="pagination-next-button"
        data-load-more
        data-load-target="reviews-panel"
        data-next-review-id="page-review-002"
        data-next-rating="8"
        data-next-comment="Second page review."
      >
        Next reviews
      </button>
    </template>
  </body>
</html>
