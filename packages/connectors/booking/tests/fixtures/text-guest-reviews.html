<!doctype html>
<html lang="en">
  <body>
    <h1 data-testid="title">Example Hotel</h1>
    <button type="button" data-action="open-reviews">Reviews</button>
    <section
      role="dialog"
      aria-label="Guest reviews"
      data-testid="reviews-panel"
      data-reviews-panel
      hidden
    ></section>
    <template data-reviews-content>
      <header>Guest Reviews</header>
      <article data-testid="review-card" data-review-id="text-review-001">
        <div data-testid="review-score">8.5</div>
        <p data-testid="review-text">An enjoyable visit.</p>
      </article>
    </template>
  </body>
</html>
