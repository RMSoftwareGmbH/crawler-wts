<!doctype html>
<html lang="en">
  <head>
    <title>Example hotel reviews</title>
  </head>
  <body>
    <h1 data-testid="title">Example Hotel</h1>
    <div data-testid="review-list">
      <article data-testid="review-card" data-review-id="booking-review-001">
        <div data-testid="review-score">9.2</div>
        <h3 data-testid="review-title">Wonderful stay</h3>
        <div data-testid="reviewer-name">Casey Example</div>
        <time data-testid="review-date">Reviewed: 12 June 2026</time>
        <p data-testid="review-text" lang="en">
          The room was clean and staff were helpful.
        </p>
        <div data-testid="review-response">Thank you for your review.</div>
      </article>
      <article data-testid="review-card">
        <div data-testid="review-score" aria-label="8 out of 10">8</div>
        <h3 data-testid="review-title">Good location</h3>
        <p data-testid="review-text">Close to public transport.</p>
      </article>
    </div>
  </body>
</html>
