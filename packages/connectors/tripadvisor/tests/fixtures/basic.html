<!doctype html>
<html lang="en">
  <head>
    <title>Example hotel reviews</title>
  </head>
  <body>
    <section data-reviews-panel>
      <article data-automation="reviewCard" data-review-id="ta-review-001">
        <span
          data-automation="bubbleRatingImage"
          aria-label="5 of 5 bubbles"
        ></span>
        <h3 data-automation="reviewTitle">Excellent stay</h3>
        <span data-automation="reviewerName">Alex Example</span>
        <time data-automation="reviewDate">Reviewed June 12, 2026</time>
        <p data-automation="reviewText">A clean room and friendly staff.</p>
        <div data-automation="ownerResponse">
          Thank you for staying with us.
        </div>
      </article>
      <article data-automation="reviewCard" data-review-id="ta-review-002">
        <span data-rating="4"></span>
        <span data-review-author>Sam Example</span>
        <span data-review-date>Reviewed May 2, 2026</span>
        <p data-review-text>Good location.</p>
      </article>
    </section>
  </body>
</html>
